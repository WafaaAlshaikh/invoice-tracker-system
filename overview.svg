<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Invoice Tracker System</title>
  <desc id="desc">Documentation banner for a full-stack invoice platform with a React client and two Spring Boot services.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102039"/><stop offset="1" stop-color="#183e4b"/></linearGradient></defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
